# .pre-commit-config.yaml
# Python-native replacement for Husky.
# Install: uv run pre-commit install
# Run manually: uv run pre-commit run --all-files

repos:
  # ── Ruff: linting + formatting (replaces flake8 + isort + black) ───────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      # No --fix: violations must fail the commit rather than silently rewriting
      # the code. Run `uv run ruff check app/ --fix` yourself when you want the
      # auto-fix, so the change is visible in the diff before it is staged.
      - id: ruff
      - id: ruff-format           # format code (like black)

  # ── Mypy: strict type checking ────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        exclude: alembic/
        additional_dependencies:
          - pydantic
          - sqlalchemy[mypy]
          - redis>=5.0.0
          - types-passlib

  # ── General file hygiene ──────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: debug-statements        # catch leftover breakpoint() / pdb
      - id: detect-private-key      # block accidental key commits

  # ── Conventional commits ──────────────────────────────────────────────────
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - refactor
          - test
          - docs
          - chore
          - perf
