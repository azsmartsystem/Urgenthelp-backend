[project]
name = "allinhelp-backend"
version = "0.1.0"
description = "ALLinHELP – Marketplace backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web framework + ASGI server
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=22.0.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "greenlet>=3.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",          # async PostgreSQL driver

    # Validation & settings
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # Cache
    "redis[hiredis]>=5.0.0",

    # Async HTTP (for external APIs: Paystack, Maps, etc.)
    "httpx>=0.27.0",

    # File uploads / S3
    "boto3>=1.34.0",
    "python-multipart>=0.0.9",

    # Push notifications (Firebase)
    "firebase-admin>=6.5.0",

    # WebSockets
    "websockets>=13.0",

    # Background tasks
    "celery[redis]>=5.4.0",

    # Observability
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",          # async test client
    "factory-boy>=3.3.0",     # test fixtures
    "ruff>=0.6.0",            # linter + formatter
    "mypy>=1.11.0",           # type checker
    "pre-commit>=3.8.0",
    "types-python-jose>=3.3.0",
    "types-passlib>=1.7.7",
    "types-redis>=4.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # flake8-annotations (enforce type hints)
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific rules
]
ignore = [
    "ANN101", # missing type annotation for self
    "ANN102", # missing type annotation for cls
    "S101",   # use of assert (fine in tests)
    "S105",   # false positive on token_type = "Bearer"
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S"]
"alembic/**/*.py" = ["ANN", "N999", "E501", "W291", "UP035", "UP007"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = false
disallow_any_explicit = false
warn_unreachable = true
exclude = ["^alembic/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["app"]
omit = ["app/db/migrations/*", "tests/*"]
